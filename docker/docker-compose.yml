version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: repoguard_backend
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - NEO4J_URI=bolt://neo4j:7687
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - qdrant
      - neo4j
      - redis
    volumes:
      - ../backend:/app/backend

  qdrant:
    image: qdrant/qdrant:latest
    container_name: repoguard_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5.16-community
    container_name: repoguard_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/repoguard_secret
    volumes:
      - neo4j_data:/data

  redis:
    image: redis:7-alpine
    container_name: repoguard_redis
    ports:
      - "6379:6379"

volumes:
  qdrant_data:
  neo4j_data:
